trigger:
  branches:
    include:
      - main

variables:
  VM_IP_PUBLICA: '20.230.10.118'

  IMAGE_NAME: '002agrupo9-sum3-imagen'

  ACR_NAME: 'rc002agrupo9sum3'

  ACR_USERNAME: 'rc002agrupo9sum3'

  ACR_PASSWORD: 'TU_PASSWORD'

stages:
- stage: Deploy
  jobs:
  - deployment: DeployToVM
    displayName: 'Deploy to VM'

    environment:
      name: 'env-002agrupo9-sum3'
      resourceType: VirtualMachine

    strategy:
      runOnce:
        deploy:
          steps:

          - script: |

              if ! command -v az > /dev/null; then
                echo "Azure CLI no está instalado. Instalando..."

                sudo apt-get update
                sudo apt-get install -y curl

                curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

                az --version
              else
                echo "Azure CLI ya está instalado."
              fi

            displayName: 'Verificar e Instalar Azure CLI'

          - script: |

              if ! command -v docker > /dev/null; then

                echo "Docker no está instalado. Instalando..."

                export DEBIAN_FRONTEND=noninteractive

                sudo apt-get update

                sudo apt-get install -y \
                  apt-transport-https \
                  ca-certificates \
                  curl \
                  gnupg \
                  lsb-release

                curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                  | sudo gpg --dearmor \
                  -o /usr/share/keyrings/docker-archive-keyring.gpg

                echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

                sudo apt-get update

                sudo apt-get install -y \
                  docker-ce \
                  docker-ce-cli \
                  containerd.io

                sudo systemctl start docker
                sudo systemctl enable docker

                docker --version

              else
                echo "Docker ya está instalado."
              fi

            displayName: 'Verificar e Instalar Docker'

          - script: |

              echo "Login en ACR..."

              echo ${ACR_PASSWORD} | sudo docker login \
              ${ACR_NAME}.azurecr.io \
              -u ${ACR_USERNAME} \
              --password-stdin

              echo "Descargando imagen..."

              sudo docker pull \
              ${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest

              if sudo docker ps -a --format '{{.Names}}' | grep -Eq "^nginx_container$"; then

                echo "Contenedor existente."

                sudo docker stop nginx_container || true
                sudo docker rm nginx_container || true

              fi

              echo "Creando contenedor..."

              sudo docker run -d \
                --name nginx_container \
                -p 80:80 \
                ${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest

              sudo docker ps

            displayName: 'Descargar y ejecutar imagen desde ACR'

          - script: |
              echo "Aplicación publicada en:"
              echo "http://${VM_IP_PUBLICA}"

            displayName: 'Mostrar URL'